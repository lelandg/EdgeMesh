name: Windows CPU regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python312-cpu:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out this revision and its MeshTools submodule
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up observed Python release
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Create an isolated test environment
        run: python -m venv "$env:GITHUB_WORKSPACE/.venv-ci"
      - name: Install pinned packaging tools
        run: '& "$env:GITHUB_WORKSPACE/.venv-ci/Scripts/python.exe" -m pip install --no-deps --only-binary=:all: pip==25.0.1 setuptools==83.0.0'
      - name: Install complete pinned CPU dependency closure
        run: '& "$env:GITHUB_WORKSPACE/.venv-ci/Scripts/python.exe" -m pip install --no-deps --no-build-isolation -r "$env:GITHUB_WORKSPACE/requirements-cpu-test.txt"'
      - name: Install application metadata without resolving dependencies
        run: '& "$env:GITHUB_WORKSPACE/.venv-ci/Scripts/python.exe" -m pip install --no-deps --no-build-isolation "$env:GITHUB_WORKSPACE"'
      - name: Check installed dependency contracts
        run: '& "$env:GITHUB_WORKSPACE/.venv-ci/Scripts/python.exe" -m pip check'
      - name: Check application and depth imports before UI tests
        run: '& "$env:GITHUB_WORKSPACE/.venv-ci/Scripts/python.exe" -X faulthandler -c "from edgemesh_bootstrap.runtime import initialize_platform_runtime; initialize_platform_runtime(); import mesh_generator; import depth_to_3d"'
      - name: Test EdgeMesh without model downloads
        run: '& "$env:GITHUB_WORKSPACE/.venv-ci/Scripts/python.exe" -X faulthandler -m unittest discover -s "$env:GITHUB_WORKSPACE/tests" -v -f'
      - name: Test MeshTools without opening a viewport
        run: '& "$env:GITHUB_WORKSPACE/.venv-ci/Scripts/python.exe" -X faulthandler -m unittest discover -s "$env:GITHUB_WORKSPACE/MeshTools/tests" -v'
