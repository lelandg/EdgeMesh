name: Windows CPU regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python312-cpu:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out this revision and its MeshTools submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up observed Python release
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Create an isolated test environment
        run: python -m venv "$env:GITHUB_WORKSPACE/.venv-ci"
      - name: Install pinned packaging tools
        run: '& "$env:GITHUB_WORKSPACE/.venv-ci/Scripts/python.exe" -m pip install --no-deps --only-binary=:all: pip==25.0.1 setuptools==84.1.0'
      - name: Install complete pinned CPU dependency closure
        run: '& "$env:GITHUB_WORKSPACE/.venv-ci/Scripts/python.exe" -m pip install --no-deps --no-build-isolation -r "$env:GITHUB_WORKSPACE/requirements-cpu-test.txt"'
      # The installed wheel supplies metadata; ordinary tests import the checkout.
      # Isolated (-I) subprocesses can intentionally exercise the installed copy.
      - name: Install application metadata without resolving dependencies
        run: '& "$env:GITHUB_WORKSPACE/.venv-ci/Scripts/python.exe" -m pip install --no-deps --no-build-isolation "$env:GITHUB_WORKSPACE"'
      - name: Check installed dependency contracts
        run: '& "$env:GITHUB_WORKSPACE/.venv-ci/Scripts/python.exe" -m pip check'
      - name: Check application and depth imports before UI tests
        run: '& "$env:GITHUB_WORKSPACE/.venv-ci/Scripts/python.exe" -X faulthandler -c "from edgemesh_bootstrap.runtime import initialize_platform_runtime; initialize_platform_runtime(); import mesh_generator; import depth_to_3d"'
      - name: Test EdgeMesh without model downloads
        # Each Python process needs the guard before discovery imports libraries.
        run: '& "$env:GITHUB_WORKSPACE/.venv-ci/Scripts/python.exe" -X faulthandler -c "from edgemesh_bootstrap.runtime import initialize_platform_runtime; initialize_platform_runtime(); import unittest; unittest.main(module=None)" discover -s "$env:GITHUB_WORKSPACE/tests" -v -f'
      - name: Test MeshTools without opening a viewport
        run: '& "$env:GITHUB_WORKSPACE/.venv-ci/Scripts/python.exe" -X faulthandler -c "from edgemesh_bootstrap.runtime import initialize_platform_runtime; initialize_platform_runtime(); import unittest; unittest.main(module=None)" discover -s "$env:GITHUB_WORKSPACE/MeshTools/tests" -v'
