[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edgemesh"
dynamic = ["version"]
description = "A desktop workspace for turning images, masks and depth into 3D meshes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "0BSD AND CC0-1.0"
license-files = ["LICENSE", "MeshTools/LICENSE"]
authors = [{name = "Leland Green"}]
dependencies = [
    "PySide6==6.11.2",
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "pillow==12.3.0",
    "scipy==1.16.2",
    "scikit-learn==1.7.2",
    "shapely==2.1.2",
    "matplotlib==3.10.6",
    "open3d==0.19.0",
    "trimesh==4.8.3",
    "pyvista==0.46.3",
    "vtk==9.5.2",
    "keyboard==0.13.5",
    "PyGetWindow==0.0.9; sys_platform == 'win32'",
]

[project.optional-dependencies]
depth = ["torch==2.13.0", "torchvision==0.28.0", "transformers==4.56.2"]
assistants = ["google-antigravity==0.1.16"]
spacemouse = ["pygame-ce==2.5.8", "hidapi==0.14.0.post4"]

[project.scripts]
edgemesh = "edgemesh_bootstrap.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}

[tool.uv]
# Prevent dependency resolution from selecting packages younger than one week.
exclude-newer = "1 week"
# Include application changes without traversing environments or model caches.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "*.py" },
    { file = "edgemesh_bootstrap/*.py" },
    { file = "MeshTools/*.py" },
    { file = "README.md" },
    { file = "LICENSE" },
    { file = "MeshTools/LICENSE" },
    { file = "MANIFEST.in" },
    { file = "EdgeMesh.ico" },
    { file = "Images/example.png" },
]
