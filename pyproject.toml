[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "edgemesh"
dynamic = ["version"]
description = "A desktop workspace for turning images, masks and depth into 3D meshes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "0BSD AND CC0-1.0"
license-files = ["LICENSE", "MeshTools/LICENSE"]
authors = [{name = "Leland Green"}]
dependencies = [
    "PySide6==6.12.0",
    "numpy==2.5.4",
    "opencv-python==4.14.0.94",
    "pillow==13.0.0",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "shapely==2.2.0",
    "matplotlib==3.11.2",
    "open3d==0.20.0",
    "trimesh==4.12.2",
    "pyvista==0.49.2",
    "vtk==9.7.1",
    "keyboard==0.13.5",
    "PyGetWindow==0.0.9; sys_platform == 'win32'",
]

[project.optional-dependencies]
depth = ["torch==2.15.0", "torchvision==0.29.2", "transformers==5.22.0"]
assistants = ["google-antigravity==0.1.23"]
spacemouse = ["pygame-ce==2.5.8", "hidapi==0.15.0"]

[project.scripts]
edgemesh = "edgemesh_bootstrap.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}

[tool.uv]
# Prevent dependency resolution from selecting packages younger than one week.
exclude-newer = "1 week"
# Include application changes without traversing environments or model caches.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "*.py" },
    { file = "edgemesh_bootstrap/*.py" },
    { file = "MeshTools/*.py" },
    { file = "README.md" },
    { file = "LICENSE" },
    { file = "MeshTools/LICENSE" },
    { file = "MANIFEST.in" },
    { file = "EdgeMesh.ico" },
    { file = "Images/example.png" },
]
